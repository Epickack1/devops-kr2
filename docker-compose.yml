services:
  app:
    build: .
    image: kr2-app:1.0
    env_file: .env                     # секрет REDIS_PASSWORD
    environment:                       # несекретные параметры
      REDIS_HOST: redis
      STUDENT: Dvurechensky
    ports:
      - "127.0.0.1:8003:8003"
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file: .env                     # нужен проверке готовности ($$REDIS_PASSWORD)
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks: [backend]
    restart: unless-stopped

networks:
  backend:

volumes:
  redis_data:
